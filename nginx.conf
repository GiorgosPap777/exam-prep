server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # The service worker and the app shell must always revalidate. Without this a
    # new deploy can sit behind a stale HTTP cache and never reach installed phones.
    location = /sw.js                { add_header Cache-Control "no-cache"; }
    location = /index.html           { add_header Cache-Control "no-cache"; }
    location = /questions.json       { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js)$          { add_header Cache-Control "no-cache"; }

    # Icons are immutable in practice and cheap to hold on to.
    location /icons/ { add_header Cache-Control "public, max-age=604800"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
